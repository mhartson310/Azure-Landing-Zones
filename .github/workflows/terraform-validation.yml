name: Landing Zone Terraform Validation

on:
  push:
    paths:
      - 'terraform/**'
      - 'examples/**'
      - '.github/workflows/terraform-validation.yml'
  pull_request:
    paths:
      - 'terraform/**'
      - 'examples/**'
      - '.github/workflows/terraform-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/single-region
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.9.8'
      - name: Check formatting (all Terraform)
        working-directory: .
        run: |
          terraform fmt -recursive
          git diff -- '*.tf'
          git diff --quiet -- '*.tf'
      - name: Initialize without backend
        run: terraform init -backend=false -input=false
      - name: Validate Terraform reference
        run: terraform validate -no-color
